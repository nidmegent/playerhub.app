
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0c">
  <title>出場アンケート | Nimdgent Esports</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-mark">N</span>
      <span>NIMDGENT <small>ESPORTS</small></span>
    </a>
    <a class="back-link" href="index.html">← カレンダーへ</a>
  </header>

  <main class="container narrow">
    <section class="hero">
      <p class="eyebrow">PLAYER RESPONSE</p>
      <h1>出場<span>アンケート</span></h1>
      <p class="muted">内容を確認して回答してください。</p>
    </section>

    <section class="panel">
      <div id="surveyStatus" class="status-pill">読み込み中...</div>
      <h2 id="surveyTitle">アンケート</h2>
      <p id="surveyTeam" class="team-label"></p>
      <div class="event-details">
        <div><span>試合日時</span><strong id="surveyDate">—</strong></div>
        <div><span>回答締切</span><strong id="surveyDeadline">—</strong></div>
      </div>

      <form id="answerForm">
        <label for="activityName">活動名</label>
        <input id="activityName" name="activityName" maxlength="40"
          autocomplete="nickname" placeholder="例：M1yuN" required>

        <fieldset>
          <legend>出場可否</legend>
          <label class="choice">
            <input type="radio" name="attendance" value="出場する" required>
            <span>出場する</span>
          </label>
          <label class="choice">
            <input type="radio" name="attendance" value="出場しない">
            <span>出場しない</span>
          </label>
          <label class="choice">
            <input type="radio" name="attendance" value="人数次第">
            <span>人数次第</span>
          </label>
        </fieldset>

        <button id="submitAnswer" class="primary-button" type="submit">
          回答を送信する
        </button>
        <p id="answerMessage" class="message" aria-live="polite"></p>
      </form>
    </section>
    <footer class="footer">
      <span>NIMDGENT ESPORTS</span>
      <span>PLAYER RESPONSE</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
